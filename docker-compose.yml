services:
  postgres:
    image: postgres:16-alpine
    container_name: kfupet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kfupet
      POSTGRES_PASSWORD: kfupet
      POSTGRES_DB: kfupet
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kfupet -d kfupet"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
